
services:
  db:
    image: postgres:18
    container_name: wanderai-db
    restart: always
    env_file:
      - ./tourism-platform_backend/.env
    environment:
      POSTGRES_DB: wanderai
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wanderai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./tourism-platform_backend
    container_name: wanderai-backend
    restart: always
    env_file:
      - ./tourism-platform_backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/wanderai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./tourism-platform
    container_name: wanderai-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  